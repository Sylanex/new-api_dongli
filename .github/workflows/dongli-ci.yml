name: Dongli CI

on:
  pull_request:
    branches: [team]
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: newapi-ci
          MYSQL_DATABASE: newapi_ci
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -pnewapi-ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newapi
          POSTGRES_PASSWORD: newapi-ci
          POSTGRES_DB: newapi_ci
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U newapi -d newapi_ci"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
      - name: Prepare embedded frontend placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
          (cd relaykit && go vet ./... && go build ./...)
          (cd tokenkit && go vet ./... && go build ./...)
      - name: Unit and integration tests
        run: make test
      - name: Paid check-in on SQLite, MySQL and PostgreSQL
        env:
          TEST_MYSQL_DSN: root:newapi-ci@tcp(127.0.0.1:3306)/newapi_ci?charset=utf8mb4&parseTime=True&loc=Local
          TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=newapi password=newapi-ci dbname=newapi_ci sslmode=disable
        run: go test ./controller -run '^TestPaidOnlyCheckinDatabaseMatrix$' -count=1 -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read upstream Bun version
        id: bun
        working-directory: .
        run: |
          version=$(sed -n 's/^FROM oven\/bun:\([^@ ]*\).*/\1/p' Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bun check -b
      - name: Lint paid check-in files
        run: >-
          bun x oxlint -c .oxlintrc.json
          src/features/profile/components/checkin-calendar-card.tsx
          src/features/profile/types.ts
          src/features/profile/__tests__/checkin.test.tsx
          src/features/system-settings/general/checkin-settings-section.tsx
          src/features/system-settings/general/__tests__/checkin-settings.test.tsx
          src/features/system-settings/billing/index.tsx
          src/features/system-settings/billing/section-registry.tsx
          src/features/system-settings/types.ts
      - run: bun run test
      - run: bun run build
